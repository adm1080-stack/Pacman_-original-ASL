<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASL Pac-Man - Deaf Culture Edition (3D JavaFX Style)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --maze-wall: #1e40af;
      --pacman-color: #facc15;
      --text-color: #f8fafc;
      --quit-color: #ef4444;
      --card-bg: #1e293b;
      --card-border: #334155;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    header {
      text-align: center;
      max-width: 500px;
      margin-bottom: 10px;
    }

    h1 { color: var(--pacman-color); margin: 0 0 5px 0; }
    p { color: #94a3b8; font-size: 0.9rem; margin: 0; }

    #game-container {
      position: relative;
      width: 330px;
      height: 330px;
      background-color: #000000;
      border: 3px solid var(--maze-wall);
      border-radius: 8px;
      overflow: hidden;
    }

    canvas { display: block; width: 100%; height: 100%; }

    #webgl-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
      z-index: 10;
    }

    .username-box {
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 100%;
    }

    .username-box label {
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .username-box input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--card-border);
      background-color: #0f172a;
      color: var(--pacman-color);
      font-weight: bold;
      text-align: center;
      width: 70%;
      font-size: 0.9rem;
    }

    .outer-dashboard {
      width: 330px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.85rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 6px;
    }

    .stats-card strong { color: var(--pacman-color); }

    .leaderboard-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.85rem;
    }

    .leaderboard-card header {
      text-align: left;
      font-weight: bold;
      color: var(--pacman-color);
      margin-bottom: 6px;
    }

    .leaderboard-list {
      max-height: 120px;
      overflow-y: auto;
      margin: 0;
      padding-left: 0;
      list-style-type: none;
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    .leaderboard-list li {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid #334155;
    }

    .leaderboard-list li:last-child { border-bottom: none; }

    button.btn {
      background-color: var(--pacman-color);
      color: #000;
      border: none;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 6px;
    }

    button.pause-btn {
      background-color: var(--quit-color);
      color: #fff;
    }

    .fact-banner {
      width: 330px;
      min-height: 44px;
      margin-top: 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 10px;
      box-sizing: border-box;
      text-align: center;
      font-size: 0.85rem;
      color: var(--pacman-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-gap: 5px;
      justify-content: center;
    }

    .ctrl-btn {
      width: 50px;
      height: 50px;
      background-color: #334155;
      color: var(--text-color);
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:active {
      background-color: var(--pacman-color);
      color: #000;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #camera-indicator {
      font-size: 0.75rem;
      color: #38bdf8;
      margin-top: 4px;
      font-weight: bold;
    }
  </style>

  <!-- Three.js WebGL Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
