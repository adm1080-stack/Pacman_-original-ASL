<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASL Pac-Man - Deaf Culture Edition</title>
  <style>
    :root {
      --bg-color: #000000;
      --maze-wall: #38bdf8;
      --pacman-color: #facc15;
      --text-color: #ffffff;
      --quit-color: #ef4444;
      --card-bg: rgba(20, 25, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.2);
    }

    body {
      margin: 0;
      padding: 0;
      background-image: url('image_4.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      min-height: 100vh;
      width: 100vw;
      box-sizing: border-box;
    }

    /* Fullscreen Welcome Overlay */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(20, 25, 45, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #welcome-screen h1 {
      font-size: 3.2rem;
      color: var(--pacman-color);
      margin: 0 0 10px 0;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
      letter-spacing: 2px;
    }

    #welcome-screen p {
      font-size: 1.3rem;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .welcome-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--card-border);
      padding: 30px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      max-width: 440px;
      width: 90%;
    }

    header {
      text-align: center;
      width: 462px;
      max-width: 90vw;
      margin: 15px 0 10px 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 18px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      box-sizing: border-box;
    }

    h1 { color: var(--pacman-color); margin: 0 0 5px 0; font-size: 1.8rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    p { color: #e2e8f0; font-size: 0.95rem; margin: 0; }

    #game-container {
      position: relative;
      width: 462px;
      height: 462px;
      background-color: #000000;
      border: 4px solid var(--maze-wall);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.95);
    }

    canvas { display: block; background-color: #000000; }

    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      border-radius: 5px;
    }

    .username-box {
      margin: 5px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .username-box label {
      font-size: 1rem;
      color: #cbd5e1;
    }
